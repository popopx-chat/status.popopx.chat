# ---------------------------------------------------------------------------
# status.popopx.chat -- POPOPX infrastructure status page (static Hugo build)
#
# What this file is: one plain nginx http-context config for a directory of
# static files. Nothing proxies, rewrites to another origin, pulls from a CDN,
# loads a remote font/script, or reports anything to a third party. The only
# request the page makes is GET /status.json on this same origin, written every
# two minutes by scripts/health_probe.py through the systemd timer installed by
# deploy_centos.sh. The page's own policy is "zero third-party requests", and
# scripts/site_audit.py enforces it on every artifact before it ships.
#
# Shape: two server blocks, deliberately NOT two copies of the same site.
#
#   :80  serves exactly one thing -- the ACME HTTP-01 challenge files -- and
#        redirects everything else to HTTPS. It carries no content, no cache
#        policy and no CSP, because there is nothing for those to apply to.
#   :443 IS the site.
#
# Placeholders CSP_SCRIPT_HASHES and CSP_STYLE_HASHES (each wrapped in @...@)
# are replaced by deploy_centos.sh with the 'sha256-...' tokens that
# scripts/site_audit.py measures from the exact bytes of the build being
# published. That is what lets the policy say script-src/style-src without
# 'unsafe-inline': the one inline <script> and the one inline <style> are
# allowlisted by hash, and any other inline code is refused by the browser.
# A plain `cp` of this file to conf.d would leave the tokens unexpanded, and
# the CSP would then not cover the inline assets -- deploy the site with the
# script, not by hand.
#
# Requirements: nginx >= 1.9.5. HTTP/2 uses the `listen ... 443 ssl http2;`
# parameter form on purpose: every build from 1.9.5 to current accepts it,
# whereas the standalone `http2 on;` directive only exists from 1.25.1. On
# nginx >= 1.25.1 `nginx -t` prints a deprecation notice about the parameter
# form; it is harmless.
#
# Install path (this is what deploy_centos.sh does, with a backup + nginx -t):
#   this file -> /etc/nginx/conf.d/status.popopx.chat.conf
# Web root (the contents of Hugo's public/, published by the same script):
#   /var/www/status.popopx.chat
#
# Cache model, and why it looks like this:
#   /status.json       live probe data, rewritten every 2 minutes by an atomic
#                      rename -> no-store, so no cache ever serves a stale row.
#   /index.html        not hashed -> must be revalidated on every load,
#                      otherwise a deploy stays invisible until cache expiry.
#   everything else    /index.json (incident feed), /index.xml (RSS),
#                      /sitemap.xml, /affected/ -> no-cache, must-revalidate.
#   root images        /logo.svg, /favicon*.png, /apple-touch-icon.png have
#   and favicons       stable names -> 7 days, must-revalidate.
#
# nginx gotcha this file avoids: `add_header` does NOT inherit into a block
# that declares its own `add_header`. Every location below therefore declares
# none; Cache-Control comes from the map at the top and the four security
# headers are set once at server level, so no location can silently drop them.
# ---------------------------------------------------------------------------

map $uri $popopx_cache_control {
    default                                      "no-cache, must-revalidate";
    ~^/status\.json$                             "no-store";
    ~*^/[^/]+\.(?:png|jpe?g|gif|webp|svg|ico)$   "public, max-age=604800, must-revalidate";
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenge only, everything else moves to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen                          80;
    listen                          [::]:80;
    server_name                     status.popopx.chat;

    root                            /var/www/status.popopx.chat;
    charset                         utf-8;
    server_tokens                   off;

    # Let's Encrypt / certbot --webroot writes here. `^~` makes this prefix win
    # over the dotfile denial, so challenges stay reachable on port 80 while
    # every other dotfile stays denied. Files land in
    # /var/www/status.popopx.chat/.well-known/acme-challenge/
    location ^~ /.well-known/acme-challenge/ {
        default_type                text/plain;
        try_files                   $uri =404;
    }

    location = /.well-known/acme-challenge/ {
        return                      404;
    }

    # 301, not 307: the site is only ever fetched with GET/HEAD, so there is
    # no request body to preserve.
    location / {
        return                      301 https://$host$request_uri;
    }

    access_log                      /var/log/nginx/status.popopx.chat.http.access.log combined;
    error_log                       /var/log/nginx/status.popopx.chat.error.log warn;
}

# ---------------------------------------------------------------------------
# HTTPS: the static status page.
# ---------------------------------------------------------------------------
server {
    listen                          443 ssl http2;
    listen                          [::]:443 ssl http2;
    server_name                     status.popopx.chat;

    ssl_certificate                 /etc/letsencrypt/live/status.popopx.chat/fullchain.pem;
    ssl_certificate_key             /etc/letsencrypt/live/status.popopx.chat/privkey.pem;
    ssl_protocols                   TLSv1.2 TLSv1.3;
    ssl_ciphers                     ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers       off;
    ssl_session_cache               shared:POPOPX_STATUS_TLS:10m;
    ssl_session_timeout             1d;

    # No OCSP stapling, on purpose: Let's Encrypt stopped serving OCSP in 2024
    # and removed the responders in 2025, so `ssl_stapling on` buys nothing and
    # only adds a resolver dependency plus stapling errors in the log.
    # Certificate lifetime is handled by the certbot systemd timer instead.

    root                            /var/www/status.popopx.chat;
    index                           index.html;
    charset                         utf-8;
    server_tokens                   off;
    autoindex                       off;

    # Only GET/HEAD have meaning for a static page; nothing here accepts a
    # body, so anything else is refused instead of being served index.html.
    if ($request_method !~ ^(GET|HEAD)$) {
        return                      405;
    }

    # -----------------------------------------------------------------------
    # Compression. Explicit type list (no `gzip_types *`), covering the Hugo
    # output: HTML, the JSON incident feed, the live status.json, RSS, the SVG
    # badge and logo, and the inline CSS/JS that Hugo emits in index.html.
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Security headers. No 'unsafe-inline' anywhere; the two inline assets are
    # allowlisted by the hashes the deploy measured (see header comment).
    #
    # frame-ancestors 'self' is the modern equivalent of X-Frame-Options
    # SAMEORIGIN; both are sent because old clients still read SAMEORIGIN.
    #
    # `upgrade-insecure-requests` is correct on this server only: on a plain
    # HTTP origin it makes the browser rewrite same-origin http:// subresource
    # URLs to https:// with no fallback, so it must never appear in the port-80
    # block above.
    #
    # HSTS starts at five minutes. It is a commitment to browsers you cannot
    # retract: raise it (63072000 = 2 years, plus includeSubDomains) only once
    # every real audience for this host has been proven to reach HTTPS.
    # -----------------------------------------------------------------------
    set $popopx_csp "default-src 'none'; script-src 'self'@CSP_SCRIPT_HASHES@; style-src 'self'@CSP_STYLE_HASHES@; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; upgrade-insecure-requests";

    add_header Content-Security-Policy  $popopx_csp                       always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "no-referrer"                     always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=300"                    always;
    add_header Cache-Control            $popopx_cache_control             always;

    # Deny .git, .env, dotfiles from interrupted uploads and any other hidden
    # path. This makes a stray `git clone` in the web root merely broken
    # instead of publicly downloadable -- but publishing only the build output
    # is what makes it impossible, see deploy_centos.sh.
    location ~ /\. {
        deny                            all;
        log_not_found                   off;
    }

    # Nothing in this build is executable: no PHP, no Python, no Node server,
    # no proxy. The list also covers leftovers (.sh, .py) in case a publish
    # ever comes from a dirty directory. `return` runs in the rewrite phase,
    # before the access phase where `deny` is evaluated, so 404 is what a
    # client actually sees; `deny all` stays as the statement of intent.
    location ~* \.(?:php|pl|py|cgi|sh|env|ini|lock|bak|old|swp|tsbuildinfo|ts|tsx|mts|cts|jsx)$ {
        deny                            all;
        return                          404;
        log_not_found                   off;
    }

    # The live probe document. no-store comes from the map; the explicit
    # default_type keeps it application/json on nginx builds whose mime.types
    # predates the .json entry.
    location = /status.json {
        default_type                    application/json;
        try_files                       $uri =404;
    }

    # Browsers that ignore the <link rel="icon"> tags still ask for this one.
    location = /favicon.ico {
        try_files                       $uri =404;
        log_not_found                   off;
    }

    # The theme's 404 page. `internal` keeps /404.html from being a browsable
    # URL of its own; an error_page redirect to an internal location is still
    # served, so the custom page works.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Real files only. There are no SPA routes: every URL the theme emits
    # exists as a file or a directory with index.html, and anything else is a
    # genuine 404 rather than a soft-200 that hides broken links.
    location / {
        try_files                       $uri $uri/ =404;
    }

    access_log                          /var/log/nginx/status.popopx.chat.access.log combined;
    error_log                           /var/log/nginx/status.popopx.chat.error.log warn;
}