# POPOPX infrastructure status site
# Static build: Hugo + the vendored POPOPX status theme (themes/popopx).
# Live probe data: scripts/health_probe.py -> status.json (same origin only).

title: POPOPX status
baseURL: https://status.popopx.chat/

buildFuture: true
enableGitInfo: true

languageCode: en
defaultContentLanguage: en

params:
  description: Real-time operational status for POPOPX relay nodes, official websites and ecosystem services.

  categories:
    - name: Core relay network
      description: POPOPX self-hosted SMP relay nodes.
    - name: Official website matrix
      description: POPOPX public web properties.
    - name: Ecosystem services
      description: POPOPX payment and automation services.

  systems:
    - name: smp1.popopx.im
      category: Core relay network
      description: Core SMP relay (TLS 443 and 5223)
      link: https://smp1.popopx.im/
    - name: popopx.chat
      category: Official website matrix
      description: Official POPOPX website
      link: https://popopx.chat/
    - name: node.popopx.chat
      category: Official website matrix
      description: Mac Node product portal
      link: https://node.popopx.chat/
    - name: mp.popopx.chat
      category: Official website matrix
      description: Service suite portal
      link: https://mp.popopx.chat/
    - name: bot.popopx.chat
      category: Official website matrix
      description: Bot Studio portal
      link: https://bot.popopx.chat/
    - name: bpay.popopx.im
      category: Ecosystem services
      description: BTCPay payment bot (system bill)
      link: https://bpay.popopx.im/

  dateFormat: January 2, 2006 at 3:04 PM UTC
  shortDateFormat: 15:04 UTC — Jan 2
  useRelativeTime: true
  skipSeconds: false
  enableLastMod: true
  useLargeHeaderDesign: false
  incidentHistoryFormat: yearly
  disableIncidentHistory: false
  disableDarkMode: true
  useLogo: true
  logo: logo.svg
  enableCustomHTML: true
  disableComplexCalculations: false
  incidentPostsPerPage: 10

  brand: "#0a0a0f"
  ok: "#00875a"
  disrupted: "#cc4400"
  down: "#e60000"
  notice: "#24478f"
  alwaysKeepBrandColor: true
  headerTextColor: white

theme: popopx

preserveTaxonomyNames: true

taxonomies:
  affected: affected

outputs:
  page:
    - html
    - json
  section:
    - html
    - json
    - rss
  home:
    - html
    - json
    - rss
    - svg
  term:
    - html
    - json
    - rss
    - svg

outputFormats:
  svg:
    isPlainText: true
    mediaType: image/svg+xml
# Hugo 0.120's HTML minifier rewrites the inline panel script into invalid
# scoping (it assigns a loop variable to the function's own name, so the
# status refresh call becomes "n is not a function"). The site is a few KB and
# gzip handles it; keep the inline script byte-exact and verified by
# scripts/site_audit.py instead of trusting that minifier.
minify:
  disableHTML: true
